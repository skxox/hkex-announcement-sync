[project]
name = "hkex-announcement-sync"
version = "0.1.0"
description = "Sync HKEX company announcements to your backend via REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.18",
    "OpenCC>=1.3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.9"]
postgres = ["asyncpg>=0.30.0"]
celery = [
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
]
s3 = ["boto3>=1.35.0"]
all = [
    "asyncmy>=0.2.9",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["E402", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
